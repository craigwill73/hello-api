name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "docker/**"
      - "requirements.txt"
      - "terraform/**"
      - "bootstrap/**"
      - "scripts/bootstrap-if-needed.sh"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docker/**"
      - "requirements.txt"
      - "terraform/**"
      - "bootstrap/**"
      - "scripts/bootstrap-if-needed.sh"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

concurrency:
  group: terraform-hello-api
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: true
  TF_VAR_subscription_id: 6f92508f-de99-458d-ba9d-4cb3e043d862
  TF_VAR_acr_name: acrhelloapicw73
  IMAGE_NAME: hello-api
  ACR_NAME: acrhelloapicw73
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: d516f545-5bc2-4046-beb4-f302965b8373
  ARM_SUBSCRIPTION_ID: 6f92508f-de99-458d-ba9d-4cb3e043d862
  AZURE_RESOURCE_GROUP: rg-hello-api
  AKS_NAME: aks-hello-api
  AZURE_TENANT_ID: d516f545-5bc2-4046-beb4-f302965b8373
  AZURE_SUBSCRIPTION_ID: 6f92508f-de99-458d-ba9d-4cb3e043d862
  TFSTATE_RG: rg-hello-api-tfstate
  TFSTATE_STORAGE: sthelloapicw73
  AZURE_LOCATION: westeurope

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TF_VAR_image_tag: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure login
        run: |
          az account show --query "{subscription:name, tenant:tenantId}" -o table
          test "$(az account show --query tenantId -o tsv)" = "${{ env.AZURE_TENANT_ID }}"

      - name: Ensure Terraform remote state backend
        working-directory: .
        run: |
          chmod +x scripts/bootstrap-if-needed.sh
          ./scripts/bootstrap-if-needed.sh

      - name: Require AKS for Kubernetes plan
        run: |
          if ! az aks show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AKS_NAME" >/dev/null 2>&1; then
            echo "AKS cluster not found yet; plan requires an existing cluster."
            exit 1
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -out=plan.out -detailed-exitcode
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          set -e
          terraform show -no-color plan.out > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/plan.txt

      - name: Comment plan on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          header: terraform-plan
          body-path: terraform/plan.txt

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  apply:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure login
        run: |
          az account show --query "{subscription:name, tenant:tenantId}" -o table
          test "$(az account show --query tenantId -o tsv)" = "${{ env.AZURE_TENANT_ID }}"

      - name: Ensure Terraform remote state backend
        working-directory: .
        run: |
          chmod +x scripts/bootstrap-if-needed.sh
          ./scripts/bootstrap-if-needed.sh

      - name: Build and push image for this commit
        working-directory: .
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"
          docker build --platform linux/amd64 -f docker/Dockerfile -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: |
          if az aks show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AKS_NAME" >/dev/null 2>&1; then
            terraform apply -auto-approve -input=false
          else
            terraform apply -auto-approve -input=false \
              -target=azurerm_resource_group.main \
              -target=azurerm_container_registry.main \
              -target=azurerm_kubernetes_cluster.main \
              -target=azurerm_role_assignment.aks_acr_pull \
              -target=azurerm_public_ip.hello

            terraform apply -auto-approve -input=false
          fi
